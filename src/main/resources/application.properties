quarkus.http.port=7880

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=root
quarkus.datasource.password=mypassword
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/dev_quarkus?timezone=UTC

# Disable Dev Services
quarkus.devservices.enabled=false
%dev.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=false

# Hibernate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.log.sql=true

# Flyway Migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

#Jwt configuration
# create your own key
smallrye.jwt.sign.key.location=key/rsaPrivateKey.pem
mp.jwt.verify.publickey.location=key/rsaPublicKey.pem
mp.jwt.verify.issuer=https://your-app.com

# HTTP Auth Configuration
quarkus.http.auth.proactive=false